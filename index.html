<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutorial APN | Galería</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    background: #0f0f1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  header h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    background: linear-gradient(90deg, #00d4ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  header p {
    color: #9ca3af;
    font-size: clamp(0.9rem, 2vw, 1.1rem);
  }

  /* CARRUSEL */
  .carousel {
    position: relative;
    width: 100%;
    /* Ancho máximo ajustado para formato móvil vertical */
    max-width: 420px; 
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 212, 255, 0.15);
    background: #111; /* Fondo oscuro para que resalten tus capturas */
  }

  .carousel-track {
    display: flex;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }

  .slide {
    min-width: 100%;
    position: relative;
    /* Formato vertical (9:16) para capturas de pantalla de celular */
    aspect-ratio: 9 / 16; 
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
  }

  .slide img {
    width: 100%;
    height: 100%;
    /* 'contain' asegura que la imagen no se recorte y respete su tamaño original */
    object-fit: contain; 
    display: block;
    /* Eliminado cualquier efecto de zoom o transición de escala */
  }

  .slide-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 30px 25px 25px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    pointer-events: none; /* Permite hacer clic a través del texto si es necesario */
  }

  .slide-caption h2 {
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    margin-bottom: 6px;
    color: #fff;
  }

  .slide-caption p {
    color: #d1d5db;
    font-size: clamp(0.8rem, 1.8vw, 0.95rem);
  }

  /* BOTONES */
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(5px);
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s ease;
    z-index: 10;
  }

  .carousel-btn:hover {
    background: rgba(0, 212, 255, 0.8);
  }

  .carousel-btn.prev { left: 10px; }
  .carousel-btn.next { right: 10px; }

  /* INDICADORES */
  .indicators {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 0;
  }

  .dot.active {
    background: #00d4ff;
    width: 28px;
    border-radius: 5px;
  }

  /* MINIATURAS */
  .thumbnails {
    display: flex;
    gap: 12px;
    margin-top: 25px;
    max-width: 420px; /* Se alinea con el ancho del carrusel */
    width: 100%;
    overflow-x: auto;
    padding: 5px;
    scrollbar-width: thin;
    scrollbar-color: #00d4ff #1a1a2e;
  }

  .thumbnails::-webkit-scrollbar { height: 6px; }
  .thumbnails::-webkit-scrollbar-thumb {
    background: #00d4ff;
    border-radius: 3px;
  }

  .thumb {
    min-width: 70px;
    width: 70px;
    aspect-ratio: 9 / 16; /* Formato vertical para las miniaturas también */
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    opacity: 0.5;
    border: 2px solid transparent;
    transition: all 0.3s ease;
    flex-shrink: 0;
    background: #111;
  }

  .thumb:hover { opacity: 0.85; }

  .thumb.active {
    opacity: 1;
    border-color: #00d4ff;
    transform: translateY(-3px);
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    body { padding: 25px 12px; }
    .carousel-btn { width: 38px; height: 38px; font-size: 1rem; }
    .slide-caption { padding: 20px 15px 15px; }
  }
</style>
</head>
<body>

<header>
</header>

<div class="carousel" id="carousel">
  <div class="carousel-track" id="track">
    
    <!-- REEMPLAZA LOS SRC CON LAS RUTAS DE TUS IMÁGENES -->
    
    <div class="slide active">
      <!-- Cambia esto por: src="img/pantalla1.jpg" -->
      <img src="1.jpg" alt="Menú APN" onerror="this.src='https://picsum.photos/400/711?random=1'">
      <div class="slide-caption">
      </div>
    </div>

    <div class="slide">
      <!-- Cambia esto por: src="img/pantalla2.jpg" -->
      <img src="2.jpg" alt="Editar APN" onerror="this.src='https://picsum.photos/400/711?random=2'">
      <div class="slide-caption">
      </div>
    </div>

    <div class="slide">
      <!-- Cambia esto por: src="img/pantalla3.jpg" -->
      <img src="3.jpg" alt="Configuración avanzada" onerror="this.src='https://picsum.photos/400/711?random=3'">
      <div class="slide-caption">
      </div>
    </div>

    <div class="slide">
      <!-- Cambia esto por: src="img/pantalla4.jpg" -->
      <img src="4.jpg" alt="Finalizar" onerror="this.src='https://picsum.photos/400/711?random=4'">
      <div class="slide-caption">
      </div>
    </div>

  </div>

  <button class="carousel-btn prev" id="prev" aria-label="Anterior">❮</button>
  <button class="carousel-btn next" id="next" aria-label="Siguiente">❯</button>

  <div class="indicators" id="indicators"></div>
</div>

<div class="thumbnails" id="thumbnails"></div>

<script>
  const track = document.getElementById('track');
  const slides = Array.from(track.children);
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const indicatorsContainer = document.getElementById('indicators');
  const thumbsContainer = document.getElementById('thumbnails');

  let currentIndex = 0;

  // Crear indicadores y miniaturas dinámicamente
  slides.forEach((slide, i) => {
    // Punto indicador
    const dot = document.createElement('button');
    dot.classList.add('dot');
    if (i === 0) dot.classList.add('active');
    dot.addEventListener('click', () => goToSlide(i));
    indicatorsContainer.appendChild(dot);

    // Miniatura
    const thumb = document.createElement('div');
    thumb.classList.add('thumb');
    if (i === 0) thumb.classList.add('active');
    const img = slide.querySelector('img').cloneNode();
    thumb.appendChild(img);
    thumb.addEventListener('click', () => goToSlide(i));
    thumbsContainer.appendChild(thumb);
  });

  const dots = Array.from(indicatorsContainer.children);
  const thumbs = Array.from(thumbsContainer.children);

  function goToSlide(index) {
    if (index < 0) index = slides.length - 1;
    if (index >= slides.length) index = 0;
    currentIndex = index;

    track.style.transform = `translateX(-${currentIndex * 100}%)`;

    slides.forEach((s, i) => s.classList.toggle('active', i === currentIndex));
    dots.forEach((d, i) => d.classList.toggle('active', i === currentIndex));
    thumbs.forEach((t, i) => t.classList.toggle('active', i === currentIndex));

    // Scroll hacia la miniatura activa
    thumbs[currentIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  // Navegación solo con clic (Sin autoplay)
  prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
  nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

  // Navegación con teclado
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goToSlide(currentIndex - 1);
    if (e.key === 'ArrowRight') goToSlide(currentIndex + 1);
  });

  // Swipe táctil
  let touchStartX = 0;
  let touchEndX = 0;
  const carousel = document.getElementById('carousel');

  carousel.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  carousel.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) goToSlide(currentIndex + 1);
      else goToSlide(currentIndex - 1);
    }
  }
</script>

</body>
</html>
